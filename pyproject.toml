[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerv"
version = "0.1.0"
description = "Semantic Retrieval System for the CODEFEST AD ASTRA 2026 Challenge."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "Team NERV" },
]

[project.scripts]
nerv-ingest = "nerv.ingestion.lector_corpus:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"nerv.chunking" = ["resources/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
  "integration: uses an external tokenizer already present in the local cache",
]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src", "generador.py"]
strict = true
pretty = true
